[package]
name = "rust-game"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
description = "A gamified Rust learning CLI — exercises, XP, time trials, boss battles"
license = "MIT"
repository = "https://github.com/cheesecake-mainframe/rust-game"

[[bin]]
name = "rust-game"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# TUI framework (0.30 required by tui-markdown, which returns ratatui-core types;
# unstable-rendered-line-info provides Paragraph::line_count for exact scroll clamping)
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"

# File watching (no debouncer — we debounce manually for version compatibility)
notify = "8.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Markdown rendering for the in-TUI lesson reader
tui-markdown = "0.3.9"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Temporary directories for sandbox
tempfile = "3"

# Embedded code editor for watch mode. Features are deliberately limited:
# `mouse-support` would take the mouse away from the terminal, costing native
# click-drag text selection (which is how compiler errors get copied out), and
# `system-editor` binds a key we would rather keep free. See ADR 0001.
edtui = { version = "0.11.7", features = ["syntax-highlighting", "arboard"] }

# Line diffing for the solution-comparison view. No required dependencies of
# its own; the default `text` feature brings in `bstr`.
similar = "3.2"

# Process group management (Unix)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Platform-specific user data directory
dirs = "6.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3"

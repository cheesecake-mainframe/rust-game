    "Use match with literal patterns: 1 => \"Monday\", 2 => \"Tuesday\", ..., _ => \"invalid\"",
    "For grades, use range patterns: 90..=100 => 'A'",
    "For FizzBuzz, match on a tuple: match (n % 3, n % 5) { (0, 0) => ..., (0, _) => ..., ... }",
]
ci = true

# --- Module 04: Ownership & Moves ---

[[exercises]]
id = "04_ownership_moves/what_is_ownership"
name = "What is Ownership?"
module = "04_ownership_moves"
type = "fix_compiler_error"
difficulty = "intermediate"
base_xp = 10
file = "04_ownership_moves/what_is_ownership.rs"
solution = "04_ownership_moves/solutions/what_is_ownership.rs"
order = 1
description = "Understand that values have exactly one owner — and moves."
flavor_text = "This is where Rust gets interesting."
time_limit_secs = 120
hints = [
    "When you assign a String to another variable, the value MOVES. The original variable is invalidated.",
    "To keep both variables usable, you need to explicitly .clone() the String.",
]

[[exercises]]
id = "04_ownership_moves/move_semantics"
name = "Move Semantics"
module = "04_ownership_moves"
type = "fix_compiler_error"
difficulty = "intermediate"
base_xp = 10
file = "04_ownership_moves/move_semantics.rs"
solution = "04_ownership_moves/solutions/move_semantics.rs"
order = 2
description = "Passing a String to a function moves ownership into the function."
hints = [
    "When a function takes a String parameter, it takes ownership. The caller can't use it after.",
    "You can either .clone() before calling, or change the function to take a reference (&str or &String).",
]

[[exercises]]
id = "04_ownership_moves/clone_and_copy"
name = "Clone and Copy"
module = "04_ownership_moves"
type = "fix_compiler_error"
difficulty = "intermediate"
base_xp = 10
file = "04_ownership_moves/clone_and_copy.rs"
solution = "04_ownership_moves/solutions/clone_and_copy.rs"
order = 3
description = "Stack types Copy automatically. Heap types must be explicitly cloned."
hints = [
    "Integers, booleans, chars, and floats implement Copy — they're automatically copied on assignment.",
    "String and Vec live on the heap and do NOT implement Copy. Use .clone() to make an explicit copy.",
]

[[exercises]]
id = "04_ownership_moves/ownership_functions"
name = "Ownership and Functions"
module = "04_ownership_moves"
type = "implement_from_scratch"
difficulty = "intermediate"
base_xp = 20
file = "04_ownership_moves/ownership_functions.rs"
solution = "04_ownership_moves/solutions/ownership_functions.rs"
order = 4
description = "Practice ownership transfer into and out of functions."
hints = [
    "make_excited takes ownership of s, modifies it, and returns it. Use `mut` in the parameter.",
    "create_greeting can use format!() which creates a new String.",
]

[[exercises]]
id = "04_ownership_moves/boss_ownership"
name = "The Ownership Gauntlet"
module = "04_ownership_moves"
type = "boss_battle"
difficulty = "intermediate"
base_xp = 50
file = "04_ownership_moves/boss_ownership.rs"
solution = "04_ownership_moves/solutions/boss_ownership.rs"
order = 5
description = "Build a Playlist with proper ownership semantics."
flavor_text = "The Gauntlet awaits. Only those who truly understand ownership may pass."
hints = [
    "Start with `impl Playlist { ... }`. The new() method creates an empty Playlist.",
    "add_song takes ownership: fn add_song(&mut self, song: Song) — push to self.songs.",
    "find_by_artist returns references: use .iter().filter().collect().",
    "remove_song returns ownership back: find the position with .iter().position(), then use .remove(pos).",
]

[[exercises]]
id = "04_ownership_moves/predict_output"
name = "Predict the Output"
module = "04_ownership_moves"
type = "reverse_engineering_fill_in"
difficulty = "intermediate"
base_xp = 15
file = "04_ownership_moves/predict_output.rs"
solution = "04_ownership_moves/solutions/predict_output.rs"
order = 6
description = "Trace through ownership transfers and predict what gets printed."
flavor_text = "Can you think like the compiler?"
ci = true
hints = [
    "String is a heap type — it moves on assignment. i32 is a stack type — it copies.",
    "Trace each function call: what gets printed inside the function, and what gets returned?",
    "Remember: x is still valid after makes_copy because i32 implements Copy.",
]


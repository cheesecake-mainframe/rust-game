name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      # Every exercise must stay solvable. Scoped to this one ignored test:
      # a bare `--ignored` also runs the performance benchmarks, one of which
      # asserts a timing ratio that flakes on shared runners.
      - name: All solutions verify
        run: cargo test --test solution_verification_test -- --ignored
